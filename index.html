<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color = --c-surface-0 (src/styles/tokens.css) -->
    <meta name="theme-color" content="#070d19" />
    <!-- PWA: instalável na home do celular. iOS ignora o manifest pra isso e
         precisa das metas apple-* abaixo. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RtMajor" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Road to Major · simulador de CS de todas as eras</title>
    <!-- Fontes do design system: Oswald = display/placar, Barlow Condensed =
         título de painel e grupo, Barlow = UI e números (tabulares). display=swap mostra o texto na
         fonte de sistema na hora; a folha entra sem bloquear a renderização
         (preload + media=print trocado no onload). Nenhum @import no CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Barlow+Condensed:wght@500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Barlow+Condensed:wght@500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Barlow+Condensed:wght@500;600;700;800&display=swap"
      />
    </noscript>
    <meta name="description" content="Road to Major: monte o time dos sonhos com lendas do CS 1.6, Source, CS:GO e CS2 e vença um Major completo em MD3." />
    <!-- Capa de compartilhamento (Reddit/X/Discord/WhatsApp). URLs ABSOLUTAS: os
         crawlers não resolvem caminho relativo. A arte vem de capturas reais do
         preview (partida online, carta do Ultimate, chave do Major); fonte em
         public/og/. SPA sem SSR: o crawler lê só este HTML, então é uma versão
         única, em inglês (pt_BR como alternate). Validado por scripts/check-og.mts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Road to Major" />
    <meta property="og:url" content="https://roadtomajor.com.br/" />
    <meta property="og:title" content="Road to Major — CS2 Manager in your browser" />
    <meta property="og:description" content="Build a dream team of Counter-Strike legends, open Ultimate cards, play online duels and win the Major." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:image" content="https://roadtomajor.com.br/og/roadtomajor-share.jpg" />
    <meta property="og:image:secure_url" content="https://roadtomajor.com.br/og/roadtomajor-share.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Road to Major gameplay: a live online match, an Ultimate player card and the Major playoff bracket." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Road to Major — CS2 Manager in your browser" />
    <meta name="twitter:description" content="Build a dream team of Counter-Strike legends, open Ultimate cards, play online duels and win the Major." />
    <meta name="twitter:image" content="https://roadtomajor.com.br/og/roadtomajor-share.jpg" />
    <meta name="twitter:image:alt" content="Road to Major gameplay: a live online match, an Ultimate player card and the Major playoff bracket." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
